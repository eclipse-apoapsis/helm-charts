ort-server:
  database:
    host: dev-dev-postgres
    name: ortserver
    schema: public
    username: ortserver
    password: ortpassword
    sslMode: disable
  transport:
    kubernetes:
      imagePullPolicy: IfNotPresent
    rabbitmq:
      enabled: true
      serverUri: amqp://dev-dev-rabbitmq:5672
      username: ortserver
      password: ortpassword
  core:
    podSecurityContext:
      supplementalGroups:
        - 0
    keycloak:
      jwtUri: http://dev-dev-keycloak:8080/realms/ort-server/protocol/openid-connect/certs
      jwtIssuer: http://localhost:8080/realms/ort-server
      accessTokenUrl: http://dev-dev-keycloak:8080/realms/ort-server/protocol/openid-connect/token
      apiUrl: http://dev-dev-keycloak:8080/admin/realms/ort-server
      apiUser: ""
      apiSecret: ortserver-api-access
      clientId: api-access
      subjectClientId: ort-server
    extraInitContainers:
      - name: wait-for-keycloak
        image: curlimages/curl:8.21.0
        command:
          - sh
          - -c
          - until curl -fsS http://dev-dev-keycloak:8080/realms/ort-server/.well-known/openid-configuration >/dev/null; do echo waiting for keycloak; sleep 2; done
    extraVolumes:
      - name: secrets
        persistentVolumeClaim:
          claimName: secrets-pvc
      - name: elasticsearch-certs
        secret:
          secretName: dev-elasticsearch-es-http-certs-public
    extraVolumeMounts:
      - name: secrets
        mountPath: /mnt/secrets
      - name: elasticsearch-certs
        mountPath: /mnt/elasticsearch-certs
        readOnly: true
    certificates:
      path: /mnt/elasticsearch-certs/
    extraEnv:
      - name: LOG_FORMAT
        value: json
      - name: LOG_FILE_PROVIDER_NAME
        value: elasticsearch
      - name: ELASTICSEARCH_SERVER_URL
        value: https://dev-elasticsearch-es-http:9200
      - name: ELASTICSEARCH_INDEX
        value: ort-server-logs-*
      - name: ELASTICSEARCH_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: ELASTICSEARCH_PAGE_SIZE
        value: "1000"
      - name: ELASTICSEARCH_USERNAME
        value: elastic
      - name: ELASTICSEARCH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: dev-elasticsearch-es-elastic-user
            key: elastic
  orchestrator:
    extraEnv:
      - name: LOG_FORMAT
        value: json
  tasks:
    extraEnv:
      - name: LOG_FORMAT
        value: json
  advisor:
    mountPvcs: secrets-pvc->/mnt/secrets,r
  analyzer:
    mountPvcs: secrets-pvc->/mnt/secrets,r
  config:
    mountPvcs: secrets-pvc->/mnt/secrets,r
  evaluator:
    mountPvcs: secrets-pvc->/mnt/secrets,r
  reporter:
    mountPvcs: secrets-pvc->/mnt/secrets,r
  scanner:
    mountPvcs: secrets-pvc->/mnt/secrets,r
  ui:
    url: http://localhost:8082
    apiUrl: http://localhost:8081
    authority: http://localhost:8080/realms/ort-server
    clientId: ort-server
  extraObjects:
    # Nodeports
    - apiVersion: v1
      kind: Service
      metadata:
        name: ort-server-core-nodeport
        namespace: "{{ .Release.Namespace }}"
        labels:
          app.kubernetes.io/name: "{{ include \"ortserver.name\" . }}"
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/component: core
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/name: "{{ include \"ortserver.name\" . }}"
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/component: core
        ports:
          - name: ort-server-core
            port: 8081
            targetPort: 8080
            nodePort: 31436
    - apiVersion: v1
      kind: Service
      metadata:
        name: ort-server-ui-nodeport
        namespace: "{{ .Release.Namespace }}"
        labels:
          app.kubernetes.io/name: "{{ include \"ortserver.name\" . }}"
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/component: ui
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/name: "{{ include \"ortserver.name\" . }}"
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/component: ui
        ports:
          - name: ort-server-ui
            port: 8082
            targetPort: 8080
            nodePort: 31437
    # Secrets Storage
    - apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: secrets-pv
      spec:
        capacity:
          storage: 1Mi
        accessModes:
          - ReadWriteMany
        storageClassName: shared-storage
        hostPath:
          path: /mnt/secrets
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: secrets-pvc
      spec:
        accessModes:
          - ReadWriteMany
        storageClassName: shared-storage
        resources:
          requests:
            storage: 1Mi

dev-postgres:
  auth:
    username: ortserver
    password: ortpassword
  persistence:
    enabled: false
  customUser:
    name: keycloak
    password: keycloak
    database: keycloak
  extraObjects:
    - apiVersion: v1
      kind: Service
      metadata:
        name: dev-postgres-nodeport
        namespace: "{{ .Release.Namespace }}"
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/name: dev-postgres
        ports:
          - name: postgresql
            port: 5432
            targetPort: 5432
            nodePort: 31432

dev-eck-elasticsearch:
  fullnameOverride: dev-elasticsearch
  version: 9.3.4
  http:
    service:
      spec:
        type: NodePort
        ports:
          - name: https
            port: 9200
            targetPort: 9200
            protocol: TCP
            nodePort: 31438
    tls:
      selfSignedCertificate:
        subjectAltNames:
          - dns: localhost
          - ip: 127.0.0.1
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          volumes:
            - name: elasticsearch-data
              emptyDir: {}
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: -Xms512m -Xmx512m
              resources:
                limits:
                  memory: 2Gi
                requests:
                  memory: 2Gi

dev-eck-kibana:
  fullnameOverride: dev-kibana
  version: 9.3.4
  elasticsearchRef:
    name: dev-elasticsearch
  config:
    server.publicBaseUrl: http://localhost:5601
  http:
    service:
      spec:
        type: NodePort
        ports:
          - name: http
            port: 5601
            targetPort: 5601
            protocol: TCP
            nodePort: 31439
    tls:
      selfSignedCertificate:
        disabled: true

dev-eck-logstash:
  fullnameOverride: dev-logstash
  version: 9.3.4
  count: 1
  config:
    api.http.host: "0.0.0.0"
    pipeline.workers: 2
  elasticsearchRefs:
    - name: dev-elasticsearch
      clusterName: ort
  pipelines:
    - pipeline.id: main
      config.string: |
        input {
          file {
            path => "/var/log/containers/*.log"
            start_position => "beginning"
            mode => "tail"
            sincedb_path => "/usr/share/logstash/data/.sincedb"
            # Keep the file path in the legacy top-level [path] field; the pipeline's early filters depend on it.
            ecs_compatibility => disabled
          }
        }

        filter {
          if ![path] and [log][file][path] {
            mutate {
              add_field => { "path" => "%{[log][file][path]}" }
            }
          }

          if "_${POD_NAMESPACE}_" not in [path] {
            drop {}
          }

          grok {
            match => {
              "path" => "/var/log/containers/%{DATA:kubernetes_pod}_%{DATA:path_namespace}_%{GREEDYDATA:kubernetes_container}-%{BASE16NUM:container_id}\\.log"
            }
            tag_on_failure => []
          }

          mutate {
            add_field => { "namespace" => "${POD_NAMESPACE}" }
          }

          grok {
            match => {
              "message" => "^%{TIMESTAMP_ISO8601:cri_time} %{WORD:stream} %{WORD:log_tag} %{GREEDYDATA:log_message}$"
            }
            tag_on_failure => ["_ort_cri_parse_failure"]
          }

          if ![log_message] {
            drop {}
          }

          # Default the message to the original unparsed log line. This ensures all logs have a [message] field.
          mutate {
            replace => { "message" => "%{log_message}" }
          }

          # Parse ORT Server's structured JSON logs.
          if [log_message] =~ /^\s*\{/ {
            json {
              source => "log_message"
              skip_on_invalid_json => true
            }
          }

          if ![component] and ![mdc][component] and "dev-ort-server-kubernetes-long-running-jobs-finder-task-" in [path] {
            mutate {
              add_field => { "component" => "kubernetes-long-running-jobs-finder" }
            }
          }

          if ![component] and ![mdc][component] and "dev-ort-server-kubernetes-lost-jobs-finder-task-" in [path] {
            mutate {
              add_field => { "component" => "kubernetes-lost-jobs-finder" }
            }
          }

          if ![component] and ![mdc][component] and "dev-ort-server-kubernetes-reaper-task-" in [path] {
            mutate {
              add_field => { "component" => "kubernetes-reaper" }
            }
          }

          if ![component] and ![mdc][component] and "dev-ort-server-delete-old-ort-runs-task-" in [path] {
            mutate {
              add_field => { "component" => "deleteOldOrtRunsTask" }
            }
          }

          if ![component] and ![mdc][component] and "dev-ort-server-delete-orphaned-entities-task-" in [path] {
            mutate {
              add_field => { "component" => "deleteOrphanedEntitiesTask" }
            }
          }

          if ![component] and ![mdc][component] and [kubernetes_container] {
            mutate {
              add_field => { "component" => "%{kubernetes_container}" }
            }
            mutate {
              gsub => [
                "component", "^dev-ort-server-", "",
                "component", "-task$", ""
              ]
            }
          }

          if ![level] {
            if [stream] == "stderr" {
              mutate {
                add_field => { "level" => "ERROR" }
              }
            } else {
              mutate {
                add_field => { "level" => "INFO" }
              }
            }
          }

          # Plain-text logs have no structured timestamp.
          # Fall back to the CRI time so they still carry a sortable [timestamp] field for Kibana.
          if ![timestamp] {
            mutate {
              add_field => { "timestamp" => "%{cri_time}" }
            }
          }

          if (![component] and ![mdc][component]) or ![level] {
            drop {}
          }

          fingerprint {
            source => ["path", "cri_time", "log_message"]
            target => "sortId"
            method => "SHA256"
          }

          mutate {
            remove_field => ["log_message"]
          }
        }

        output {
          elasticsearch {
            hosts => [ "${ORT_ES_HOSTS}" ]
            user => "${ORT_ES_WRITE_USER}"
            password => "${ORT_ES_WRITE_PASSWORD}"
            ssl_certificate_authorities => "${ORT_ES_SSL_CERTIFICATE_AUTHORITY}"
            index => "ort-server-logs-%{[namespace]}"
            document_id => "%{[sortId]}"
            ilm_enabled => false
            manage_template => false
          }
        }
  podTemplate:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups:
          - 0
      volumes:
        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
      containers:
        - name: logstash
          env:
            - name: LS_JAVA_OPTS
              value: -Xms512m -Xmx512m
            - name: ORT_ES_WRITE_USER
              value: elastic
            - name: ORT_ES_WRITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-elasticsearch-es-elastic-user
                  key: elastic
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 1Gi

dev-rabbitmq:
  persistence:
    enabled: false
  definitions:
    enabled: true
    users:
      - name: ortserver
        password: ortpassword
        tags:
          - administrator
    permissions:
      - user: ortserver
        vhost: "/"
        configure: ".*"
        write: ".*"
        read: ".*"
    queues:
      - name: advisor
        vhost: "/"
        durable: true
        auto_delete: false
        arguments:
          x-queue-type: classic
      - name: analyzer
        vhost: "/"
        durable: true
        auto_delete: false
        arguments:
          x-queue-type: classic
      - name: core
        vhost: "/"
        durable: true
        auto_delete: false
        arguments:
          x-queue-type: classic
      - name: evaluator
        vhost: "/"
        durable: true
        auto_delete: false
        arguments:
          x-queue-type: classic
      - name: orchestrator
        vhost: "/"
        durable: true
        auto_delete: false
        arguments:
          x-queue-type: classic
      - name: reporter
        vhost: "/"
        durable: true
        auto_delete: false
        arguments:
          x-queue-type: classic
      - name: scanner
        vhost: "/"
        durable: true
        auto_delete: false
        arguments:
          x-queue-type: classic
    vhosts:
      - name: "/"
  extraObjects:
    - apiVersion: v1
      kind: Service
      metadata:
        name: dev-rabbitmq-nodeport
        namespace: "{{ .Release.Namespace }}"
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/name: dev-rabbitmq
        ports:
          - name: rabbitmq
            port: 15672
            targetPort: 15672
            nodePort: 31434

dev-keycloak:
  keycloak:
    adminUser: ortserver
    adminPassword: ortpassword
  persistence:
    enabled: false
  postgres:
    enabled: false
  database:
    type: postgres
    host: dev-dev-postgres.default.svc.cluster.local
    port: "5432"
    name: keycloak
    user: keycloak
    password: keycloak
  realm:
    import: true
    configFile: |
      {
        "realm": "ort-server",
        "enabled": true,
        "clients": [
          {
            "clientId": "ort-server",
            "name": "ort-server",
            "secret": "",
            "redirectUris": [
              "*"
            ],
            "webOrigins": [
              "*"
            ],
            "implicitFlowEnabled": true,
            "directAccessGrantsEnabled": true,
            "publicClient": true,
            "frontchannelLogout": true,
            "defaultClientScopes": [
              "audience",
              "basic",
              "email",
              "profile",
              "roles"
            ]
          },
          {
            "clientId": "api-access",
            "name": "api-access",
            "surrogateAuthRequired": false,
            "enabled": true,
            "alwaysDisplayInConsole": false,
            "clientAuthenticatorType": "client-secret",
            "secret": "ortserver-api-access",
            "redirectUris": [
              "/*"
            ],
            "webOrigins": [
              "/*"
            ],
            "serviceAccountsEnabled": true,
            "publicClient": false,
            "defaultClientScopes": [
              "roles"
            ],
            "optionalClientScopes": [
              "offline_access"
            ]
          }
        ],
        "clientScopes": [
          {
            "name": "audience",
            "protocol": "openid-connect",
            "protocolMappers": [
              {
                "name": "audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper",
                "config": {
                  "included.client.audience": "ort-server",
                  "access.token.claim": "true"
                }
              }
            ]
          },
          {
            "name": "basic",
            "description": "OpenID Connect scope for add all basic claims to the token",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "false",
              "display.on.consent.screen": "false"
            },
            "protocolMappers": [
              {
                "name": "auth_time",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usersessionmodel-note-mapper",
                "consentRequired": false,
                "config": {
                  "user.session.note": "AUTH_TIME",
                  "id.token.claim": "true",
                  "introspection.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "auth_time",
                  "jsonType.label": "long"
                }
              },
              {
                "name": "sub",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-sub-mapper",
                "consentRequired": false,
                "config": {
                  "access.token.claim": "true",
                  "introspection.token.claim": "true"
                }
              }
            ]
          },
          {
            "name": "email",
            "description": "OpenID Connect built-in scope: email",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "consent.screen.text": "${emailScopeConsentText}",
              "display.on.consent.screen": "true"
            },
            "protocolMappers": [
              {
                "name": "email verified",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-property-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "emailVerified",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "email_verified",
                  "jsonType.label": "boolean"
                }
              },
              {
                "name": "email",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "email",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "email",
                  "jsonType.label": "String"
                }
              }
            ]
          },
          {
            "name": "profile",
            "description": "OpenID Connect built-in scope: profile",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "consent.screen.text": "${profileScopeConsentText}",
              "display.on.consent.screen": "true"
            },
            "protocolMappers": [
              {
                "name": "full name",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-full-name-mapper",
                "consentRequired": false,
                "config": {
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true"
                }
              },
              {
                "name": "profile",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "profile",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "profile",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "updated at",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "updatedAt",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "updated_at",
                  "jsonType.label": "long"
                }
              },
              {
                "name": "given name",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "firstName",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "given_name",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "family name",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "lastName",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "family_name",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "zoneinfo",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "zoneinfo",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "zoneinfo",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "locale",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "locale",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "locale",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "middle name",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "middleName",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "middle_name",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "gender",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "gender",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "gender",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "birthdate",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "birthdate",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "birthdate",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "website",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-attribute-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "user.attribute": "website",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "website",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "username",
                "protocol": "openid-connect",
