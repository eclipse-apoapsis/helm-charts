containerRegistry: ghcr.io/eclipse-apoapsis
# -- Name of the image pull secret to use for pulling the Docker images
imagePullSecret: null

# -- String to partially override ortserver.fullname
nameOverride: ""
# -- String to fully override ortserver.fullname
fullnameOverride: ""
# -- Map of labels to add to all deployed objects
commonLabels: {}
# -- Map of labels to add to all pods
podLabels: {}

configFileProvider:
  gitConfig:
    # -- If enabled, the Git configuration is provided via a Git repository.
    enabled: true
    # -- The URL of the Git repository to use for providing the configuration. The repository must be publicly accessible or references to
    # config secrets containing the credentials must be added to the URL, for example:
    # https://usernameSecret:tokenSecret@example.com/repo.git
    repositoryUrl: https://github.com/mnonnenmacher/ort-server-config.git

database:
  # -- The database host to connect to.
  host: ort-server-db.postgres.database.azure.com
  # -- The database port to connect to.
  port: 5432
  # -- The name of the database to connect to.
  name: ort-server
  # -- The database schema to use.
  schema: ort-server
  # -- The username to use for connecting to the database.
  username: ort-server
  # -- The password to use for connecting to the database.
  password: ort-server
  # -- The SSL mode to use for connecting to the database. Must be one of "disable", "require", "verify-ca", or "verify-full".
  sslMode: require

secrets:
  azureKeyVault:
    # -- If enabled, user secrets are stored in Azure Key Vault.
    enabled: false
    # -- The name of the Azure Key Vault to use.
    keyVaultName: ""
  database:
    # -- If enabled, database credentials are stored in the database.
    enabled: false
    # -- Master password for encrypting secrets stored in the database. Must be at least 16 characters long.
    masterPassword: ""
    # -- Salt for encrypting secrets stored in the database. Must be a hex-encoded string of at least 32 hex characters.
    salt: ""
    # -- Version of the encryption key. Do not change, key rotation is not yet supported.
    keyVersion: 1
  fileBased:
    # -- If enabled, user secrets are stored in a file. This should only be used for testing, not in production.
    enabled: true
    # -- Path to the file where user secrets are stored.
    path: /mnt/secrets/secrets
  scaleway:
    # -- If enabled, user secrets are stored in Scaleway Secret Manager.
    enabled: false
    # -- The URL of the Scaleway Secret Manager API.
    serverUrl: https://api.scaleway.com/
    # -- The API version of the Scaleway Secret Manager to use.
    apiVersion: v1beta1
    # -- The region where the Scaleway Secret Manager is hosted.
    region: fr-par
    # -- The ID of the Scaleway project where secrets are stored.
    projectId: ""
    # -- The secret key for accessing the Scaleway Secret Manager.
    secretKey: ""
  vault:
    # -- If enabled, user secrets are stored in HashiCorp Vault.
    enabled: false
    # -- The URI of the Vault server.
    uri: ""
    # -- The role ID assigned to this client application.
    roleId: ""
    # -- The secret ID assigned to this client application.
    secretId: ""
    # -- The path in Vault where secrets are stored.
    rootPath: ""
    # -- The path prefix under which the secrets engine is located.
    prefix: secret
    # -- The Vault namespace to use for storing secrets. This is only relevant if Vault namespaces are enabled in the Vault server.
    namespace: null
    # -- Timeout for requests to the Vault server in seconds. If not set, the default HTTP client timeout is used.
    timeoutSeconds: ""

configSecrets:
  name: secret-file
  files: ""
  # -- If enabled, secrets are read from environment variables, otherwise from the configured files.
  allowSecretsFromConfig: true

storage:
  azureBlob:
    # -- If enabled, Azure Blob Storage is used for storing file archives, file lists, and reports.
    enabled: false
    # -- The endpoint URL of the Azure Blob Storage account. Mutually exclusive with accountName.
    endpointUrl: ""
    # -- The name of the Azure Blob Storage account when using the default blob storage endpoint. Mutually exclusive with endpointUrl.
    accountName: ""
    containers:
      # -- The name of the Azure Blob Storage container to use for storing file archives.
      fileArchives: file-archives
      # -- The name of the Azure Blob Storage container to use for storing file lists.
      fileLists: file-lists
      # -- The name of the Azure Blob Storage container to use for storing reports.
      reports: reports
  database:
    # -- If enabled, the database is used for storing file archives, file lists, and reports. This is not recommended for production use.
    enabled: true
    # -- The maximum of data to load into memory before buffering to disk.
    inMemoryLimit: 1048576
    namespaces:
      # -- The namespace to use for storing file archives in the database.
      fileArchives: fileArchives
      # -- The namespace to use for storing file lists in the database.
      fileLists: fileLists
      # -- The namespace to use for storing reports in the database.
      reports: reports
  s3:
    # -- If enabled, an S3-compatible object storage is used for storing file archives, file lists, and reports.
    enabled: false
    # -- The endpoint URL of the S3-compatible object storage.
    endpointUrl: ""
    # -- The access key to use.
    accessKey: ""
    # -- The secret key to use.
    secretKey: ""
    # -- The optional region of the S3-compatible object storage.
    region: ""
    # -- If true, the S3 client will add the bucket name to the path instead of using it as a subdomain. This is required for some S3
    # compatible storages.
    forcePathStyle: false
    buckets:
      # -- The name of the S3 bucket to use for storing file archives.
      fileArchives: file-archives
      # -- The name of the S3 bucket to use for storing file lists.
      fileLists: file-lists
      # -- The name of the S3 bucket to use for storing reports.
      reports: reports
    prefixes:
      # -- An optional prefix to use for storing file archives in the S3 bucket. Required when sharing the bucket with file lists or reports
      # to avoid name collisions.
      fileArchives: ""
      # -- An optional prefix to use for storing file lists in the S3 bucket. Required when sharing the bucket with file archives or reports
      # to avoid name collisions.
      fileLists: ""
      # -- An optional prefix to use for storing reports in the S3 bucket. Required when sharing the bucket with file archives or file lists
      # to avoid name collisions.
      reports: ""

transport:
  queues:
    # -- Name of the queue used to send messages to the orchestrator deployment.
    orchestrator: orchestrator
  kubernetes:
    # -- The image pull policy to use for the worker pods. Must be one of "Always", "IfNotPresent", or "Never".
    imagePullPolicy: Always
    # -- The backoff limit for the worker pods. This is the number of retries before marking a job as failed.
    backoffLimit: 0
    # -- The restart policy for the worker pods. Must be one of "Always", "OnFailure", or "Never". Should usually not be changed as failing
    # worker jobs are handled by the orchestrator.
    restartPolicy: Never
    # -- The user ID to run the worker containers as.
    userId: 1000
    advisor:
      # -- CPU request for advisor worker pods. If not set, no CPU request is defined.
      cpuRequest: ""
      # -- CPU limit for advisor worker pods. If not set, no CPU limit is defined.
      cpuLimit: ""
      # -- Memory request for advisor worker pods. If not set, no memory request is defined.
      memoryRequest: 1Gi
      # -- Memory limit for advisor worker pods. If not set, no memory limit is defined.
      memoryLimit: 1Gi
      # -- EmptyDir volumes to mount into the advisor worker pods. Each entry must be in the format "name->path", where "name" is the name
      # of the EmptyDir volume and "path" is the path inside the container to mount the volume to. Multiple entries must be separated by
      # whitespace.
      mountEmptyDirs: ""
      # -- PVCs to mount into the advisor worker pods. Each entry must be in the format "pvcName->path,access", where "pvcName" is the name
      # of the PVC to mount, "path" is the path inside the container to mount the PVC to, and "access" is either "R" for read-only or "W"
      # for read-write access. Multiple entries must be separated by whitespace.
      mountPvcs: ""
      # -- Secrets to mount into the advisor worker pods. Each entry must be in the format "secret->path|subPath", where "secret" is the
      # name of the Secret to mount, "path" is the path inside the container to mount the Secret to, and "subPath" is an optional subPath of
      # the Secret to mount.
      mountSecrets: ""
    analyzer:
      # -- CPU request for analyzer worker pods. If not set, no CPU request is defined.
      cpuRequest: ""
      # -- CPU limit for analyzer worker pods. If not set, no CPU limit is defined.
      cpuLimit: ""
      # -- Memory request for analyzer worker pods. If not set, no memory request is defined.
      memoryRequest: 4Gi
      # -- Memory limit for analyzer worker pods. If not set, no memory limit is defined.
      memoryLimit: 4Gi
      # -- EmptyDir volumes to mount into the analyzer worker pods. Each entry must be in the format "name->path", where "name" is the name
      # of the EmptyDir volume and "path" is the path inside the container to mount the volume to. Multiple entries must be separated by
      # whitespace.
      mountEmptyDirs: ""
      # -- PVCs to mount into the analyzer worker pods. Each entry must be in the format "pvcName->path,access", where "pvcName" is the name
      # of the PVC to mount, "path" is the path inside the container to mount the PVC to, and "access" is either "R" for read-only or "W"
      # for read-write access. Multiple entries must be separated by whitespace.
      mountPvcs: ""
      # -- Secrets to mount into the analyzer worker pods. Each entry must be in the format "secret->path|subPath", where "secret" is the
      # name of the Secret to mount, "path" is the path inside the container to mount the Secret to, and "subPath" is an optional subPath of
      # the Secret to mount.
      mountSecrets: ""
    config:
      # -- CPU request for config worker pods. If not set, no CPU request is defined.
      cpuRequest: ""
      # -- CPU limit for config worker pods. If not set, no CPU limit is defined.
      cpuLimit: ""
      # -- Memory request for config worker pods. If not set, no memory request is defined.
      memoryRequest: 1Gi
      # -- Memory limit for config worker pods. If not set, no memory limit is defined.
      memoryLimit: 1Gi
      # -- EmptyDir volumes to mount into the config worker pods. Each entry must be in the format "name->path", where "name" is the name of
      # the EmptyDir volume and "path" is the path inside the container to mount the volume to. Multiple entries must be separated by
      # whitespace.
      mountEmptyDirs: ""
      # -- PVCs to mount into the config worker pods. Each entry must be in the format "pvcName->path,access", where "pvcName" is the name
      # of the PVC to mount, "path" is the path inside the container to mount the PVC to, and "access" is either "R" for read-only or "W"
      # for read-write access. Multiple entries must be separated by whitespace.
      mountPvcs: ""
      # -- Secrets to mount into the config worker pods. Each entry must be in the format "secret->path|subPath", where "secret" is the name
      # of the Secret to mount, "path" is the path inside the container to mount the Secret to, and "subPath" is an optional subPath of the
      # Secret to mount.
      mountSecrets: ""
    evaluator:
      # -- CPU request for evaluator worker pods. If not set, no CPU request is defined.
      cpuRequest: ""
      # -- CPU limit for evaluator worker pods. If not set, no CPU limit is defined.
      cpuLimit: ""
      # -- Memory request for evaluator worker pods. If not set, no memory request is defined.
      memoryRequest: 4Gi
      # -- Memory limit for evaluator worker pods. If not set, no memory limit is defined.
      memoryLimit: 4Gi
      # -- EmptyDir volumes to mount into the evaluator worker pods. Each entry must be in the format "name->path", where "name" is the name
      # of the EmptyDir volume and "path" is the path inside the container to mount the volume to. Multiple entries must be separated by
      # whitespace.
      mountEmptyDirs: ""
      # -- PVCs to mount into the evaluator worker pods. Each entry must be in the format "pvcName->path,access", where "pvcName" is the
      # name of the PVC to mount, "path" is the path inside the container to mount the PVC to, and "access" is either "R" for read-only or
      # "W" for read-write access. Multiple entries must be separated by whitespace.
      mountPvcs: ""
      # -- Secrets to mount into the evaluator worker pods. Each entry must be in the format "secret->path|subPath", where "secret" is the
      # name of the Secret to mount, "path" is the path inside the container to mount the Secret to, and "subPath" is an optional subPath of
      # the Secret to mount.
      mountSecrets: ""
    reporter:
      # -- CPU request for reporter worker pods. If not set, no CPU request is defined.
      cpuRequest: ""
      # -- CPU limit for reporter worker pods. If not set, no CPU limit is defined.
      cpuLimit: ""
      # -- Memory request for reporter worker pods. If not set, no memory request is defined.
      memoryRequest: 4Gi
      # -- Memory limit for reporter worker pods. If not set, no memory limit is defined.
      memoryLimit: 4Gi
      # -- EmptyDir volumes to mount into the reporter worker pods. Each entry must be in the format "name->path", where "name" is the name
      # of the EmptyDir volume and "path" is the path inside the container to mount the volume to. Multiple entries must be separated by
      # whitespace.
      mountEmptyDirs: ""
      # -- PVCs to mount into the reporter worker pods. Each entry must be in the format "pvcName->path,access", where "pvcName" is the name
      # of the PVC to mount, "path" is the path inside the container to mount the PVC to, and "access" is either "R" for read-only or "W"
      # for read-write access. Multiple entries must be separated by whitespace.
      mountPvcs: ""
      # -- Secrets to mount into the reporter worker pods. Each entry must be in the format "secret->path|subPath", where "secret" is the
      # name of the Secret to mount, "path" is the path inside the container to mount the Secret to, and "subPath" is an optional subPath of
      # the Secret to mount.
      mountSecrets: ""
    scanner:
      # -- CPU request for scanner worker pods. If not set, no CPU request is defined.
      cpuRequest: ""
      # -- CPU limit for scanner worker pods. If not set, no CPU limit is defined.
      cpuLimit: ""
      # -- Memory request for scanner worker pods. If not set, no memory request is defined.
      memoryRequest: 8Gi
      # -- Memory limit for scanner worker pods. If not set, no memory limit is defined.
      memoryLimit: 8Gi
      # -- EmptyDir volumes to mount into the scanner worker pods. Each entry must be in the format "name->path", where "name" is the name
      # of the EmptyDir volume and "path" is the path inside the container to mount the volume to. Multiple entries must be separated by
      # whitespace.
      mountEmptyDirs: ""
      # -- PVCs to mount into the scanner worker pods. Each entry must be in the format "pvcName->path,access", where "pvcName" is the name
      # of the PVC to mount, "path" is the path inside the container to mount the PVC to, and "access" is either "R" for read-only or "W"
      # for read-write access. Multiple entries must be separated by whitespace.
      mountPvcs: ""
      # -- Secrets to mount into the scanner worker pods. Each entry must be in the format "secret->path|subPath", where "secret" is the
      # name of the Secret to mount, "path" is the path inside the container to mount the Secret to, and "subPath" is an optional subPath of
      # the Secret to mount.
      mountSecrets: ""
  rabbitmq:
    # -- If enabled, RabbitMQ is used as the message broker.
    enabled: true
    # -- The URI of the RabbitMQ server to connect to when using RabbitMQ as the message broker. Must be in the format
    # amqp://username:password@host:port/vhost.
    serverUri: ""
    # -- The username to use for connecting to the RabbitMQ server.
    username: ""
    # -- The password to use for connecting to the RabbitMQ server.
    password: ""

core:
  # -- Comma-separated list of hosts that are allowed for cross-origin request sharing (CORS) when accessing the API. This should usually
  # include the host of the UI deployment.
  uiHosts: localhost:5173,localhost:8082
  service:
    # -- The port to use for the core service (API).
    port: 8081
  keycloak:
    # -- The URI of the Keycloak server's JWKS endpoint for validating JWTs.
    jwtUri: https://keycloak.ortserver.org/realms/master/protocol/openid-connect/certs
    # -- The expected issuer claim in the JWTs.
    jwtIssuer: https://keycloak.ortserver.org/realms/master
    # -- The expected audience claim in the JWTs.
    jwtAudience: ort-server
    # -- The realm to use for token validation.
    jwtRealm: ort-server
    # -- The URL of the Keycloak server's token endpoint for obtaining access tokens to call the Keycloak API.
    accessTokenUrl: https://keycloak.ortserver.org/realms/master/protocol/openid-connect/token
    # -- The URL of the Keycloak server's admin API endpoint.
    apiUrl: https://keycloak.ortserver.org/admin/realms/master
    # -- The username to use for authenticating to the Keycloak admin API. Set to an empty string when using the client credentials flow.
    apiUser: ort-server
    # -- The password to use for authenticating to the Keycloak admin API.
    apiSecret: ort-server
    # -- The client ID to use for authenticating to the Keycloak admin API.
    clientId: admin-cli
  livenessProbe:
    # -- Enable livenessProbe for the core deployment
    enabled: true
    # -- Initial delay before the liveness probe is initiated
    initialDelaySeconds: 60
    # -- Period between liveness probe checks
    periodSeconds: 10
    # -- Timeout for the liveness probe
    timeoutSeconds: 5
    # -- Minimum consecutive successes for the liveness probe to be considered successful
    successThreshold: 1
    # -- Minimum consecutive failures for the liveness probe to be considered failed
    failureThreshold: 6
  # -- CPU and memory requests and limits for the core deployment
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  # -- Pod security context for the core deployment
  podSecurityContext: {}
  certificates:
    # -- Path to a directory containing PEM-encoded certificates to import into the Java keystore at startup. Each file in the directory
    # must contain one PEM-encoded certificate. When set, the container command is overridden to run the import script before starting the
    # application. Typical usage: mount a Kubernetes Secret (one key per certificate) via extraVolumes and extraVolumeMounts, then set this
    # to the mount path.
    path: ""
  # -- Additional volumes for the core deployment
  extraVolumes: []
  # -- Additional volume mounts for the core deployment
  extraVolumeMounts: []
  # -- Additional environment variables for the core deployment
  extraEnv: []
  # -- Additional init containers for the core deployment
  extraInitContainers: []

orchestrator:
  # -- CPU and memory requests and limits for the orchestrator deployment
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  # -- Additional volumes for the orchestrator deployment
  extraVolumes: []
  # -- Additional volume mounts for the orchestrator deployment
  extraVolumeMounts: []
  # -- Additional environment variables for the orchestrator deployment
  extraEnv: []
  # -- Additional init containers for the orchestrator deployment
  extraInitContainers: []

tasks:
  # -- CPU and memory requests and limits for the task cron jobs
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  certificates:
    # -- Path to a directory containing PEM-encoded certificates to import into the Java keystore at startup. Each file in the directory
    # must contain one PEM-encoded certificate. When set, the container command is overridden to run the import script before starting the
    # application. Typical usage: mount a Kubernetes Secret (one key per certificate) via extraVolumes and extraVolumeMounts, then set this
    # to the mount path.
    path: ""
  # -- Additional volumes for the task cron jobs
  extraVolumes: []
  # -- Additional volume mounts for the task cron jobs
  extraVolumeMounts: []
  # -- Additional environment variables for the task cron jobs
  extraEnv: []
  # -- Additional init containers for the task cron jobs
  extraInitContainers: []
  configs:
    - name: delete-old-ort-runs
      schedule: "15 0 * * *"
      dataRetention:
        ortRunDays: 90
    - name: delete-orphaned-entities
      schedule: "30 1 * * *"
      vcsInfo:
        limit: 1024
        chunkSize: 64
      remoteArtifacts:
        limit: 1024
        chunkSize: 64
      snippets:
        limit: 1048576
        chunkSize: 1024
      snippetFindings:
        limit: 1048576
        chunkSize: 1024
    - name: kubernetes-reaper
      schedule: "*/5 * * * *"
      reaperMaxAge: 600
    - name: kubernetes-long-running-jobs-finder
      schedule: "*/5 * * * *"
      timeouts:
        configWorker: 1
        analyzerWorker: 120
        advisorWorker: 2
        scannerWorker: 1440
        evaluatorWorker: 5
        reporterWorker: 30
        notifierWorker: 10
    - name: kubernetes-lost-jobs-finder
      schedule: "*/2 * * * *"
      lostJobsMinAge: 30

ui:
  url: ""
  apiUrl: ""
  authority: ""
  clientId: ""
  service:
    port: 8082
  # -- CPU and memory requests and limits for the UI deployment
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Additional volumes for the UI deployment
  extraVolumes: []
  # -- Additional volume mounts for the UI deployment
  extraVolumeMounts: []

extraObjects: []
