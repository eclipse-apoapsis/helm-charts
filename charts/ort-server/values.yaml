containerRegistry: ghcr.io/eclipse-apoapsis
## @param imagePullSecret Name of the image pull secret to use for pulling the Docker images
imagePullSecret: null

## @param nameOverride String to partially override ortserver.fullname
nameOverride: ""
## @param fullnameOverride String to fully override ortserver.fullname
fullnameOverride: ""
## @param commonLabels Map of labels to add to all deployed objects
commonLabels: {}
## @param podLabels Map of labels to add to all pods
podLabels: {}

configFileProvider:
  gitConfig:
    enabled: true
    repositoryUrl: https://github.com/mnonnenmacher/ort-server-config.git

database:
  host: ort-server-db.postgres.database.azure.com
  port: 5432
  name: ort-server
  schema: ort-server
  username: ort-server
  password: ort-server
  sslMode: require

secrets:
  azureKeyVault:
    ## @param secrets.azureKeyVault.enabled If enabled, user secrets are stored in Azure Key Vault.
    enabled: false
    ## @param secrets.azureKeyVault.keyVaultName The name of the Azure Key Vault to use.
    keyVaultName: ""
  database:
    ## @param secrets.database.enabled If enabled, database credentials are stored in the database.
    enabled: false
    ## @param secrets.database.masterPassword Master password for encrypting secrets stored in the database. Must be at least 16 characters long.
    masterPassword: ""
    ## @param secrets.database.salt Salt for encrypting secrets stored in the database. Must be a hex-encoded string of at least 32 hex characters.
    salt: ""
    ## @param secrets.database.keyVersion Version of the encryption key. Do not change, key rotation is not yet supported.
    keyVersion: 1
  fileBased:
    ## @param secrets.fileBased.enabled If enabled, user secrets are stored in a file. This should only be used for testing, not in production.
    enabled: true
    ## @param secrets.fileBased.path Path to the file where user secrets are stored.
    path: /mnt/secrets/secrets
  scaleway:
    ## @param secrets.scaleway.enabled If enabled, user secrets are stored in Scaleway Secret Manager.
    enabled: false
    ## @param secrets.scaleway.serverUrl The URL of the Scaleway Secret Manager API.
    serverUrl: https://api.scaleway.com/
    ## @param secrets.scaleway.apiVersion The API version of the Scaleway Secret Manager to use.
    apiVersion: v1beta1
    ## @param secrets.scaleway.region The region where the Scaleway Secret Manager is hosted.
    region: fr-par
    ## @param secrets.scaleway.projectId The ID of the Scaleway project where secrets are stored.
    projectId: ""
    ## @param secrets.scaleway.secretKey The secret key for accessing the Scaleway Secret Manager.
    secretKey: ""
  vault:
    ## @param secrets.vault.enabled If enabled, user secrets are stored in HashiCorp Vault.
    enabled: false
    ## @param secrets.vault.uri The URI of the Vault server.
    uri: ""
    ## @param secrets.vault.roleId The role ID assigned to this client application.
    roleId: ""
    ## @param secrets.vault.secretId The secret ID assigned to this client application.
    secretId: ""
    ## @param secrets.vault.path The path in Vault where secrets are stored.
    rootPath: ""
    ## @param secrets.vault.engineVersion The path prefix under which the secrets engine is located.
    prefix: secret
    ## @param secrets.vault.namespace The Vault namespace to use for storing secrets. This is only relevant if Vault namespaces are enabled in the Vault server.
    namespace: null

configSecrets:
  name: secret-file
  files: ""
  ## @param configSecrets.allowSecretsFromConfig If enabled, secrets are read from environment variables, otherwise from the configured files.
  allowSecretsFromConfig: true

storage:
  azureBlob:
    ## @param storage.azureBlob.enabled If enabled, Azure Blob Storage is used for storing file archives, file lists, and reports.
    enabled: false
    ## @param storage.azureBlob.endpointUrl The endpoint URL of the Azure Blob Storage account. Mutually exclusive with accountName.
    endpointUrl: ""
    ## @param storage.azureBlob.accountName The name of the Azure Blob Storage account when using the default blob storage endpoint. Mutually exclusive with endpointUrl.
    accountName: ""
    containers:
      ## @param storage.azureBlob.containers.fileArchives The name of the Azure Blob Storage container to use for storing file archives.
      fileArchives: file-archives
      ## @param storage.azureBlob.containers.fileLists The name of the Azure Blob Storage container to use for storing file lists.
      fileLists: file-lists
      ## @param storage.azureBlob.containers.reports The name of the Azure Blob Storage container to use for storing reports.
      reports: reports
  database:
    ## @param storage.database.enabled If enabled, the database is used for storing file archives, file lists, and reports. This is not recommended for production use.
    enabled: true
    ## @param storage.database.inMemoryLimit The maximum of data to load into memory before buffering to disk.
    inMemoryLimit: 1048576
    namespaces:
      ## @param storage.database.namespaces.fileArchives The namespace to use for storing file archives in the database.
      fileArchives: fileArchives
      ## @param storage.database.namespaces.fileLists The namespace to use for storing file lists in the database.
      fileLists: fileLists
      ## @param storage.database.namespaces.reports The namespace to use for storing reports in the database.
      reports: reports
  s3:
    ## @param storage.s3.enabled If enabled, an S3-compatible object storage is used for storing file archives, file lists, and reports.
    enabled: false
    ## @param storage.s3.endpointUrl The endpoint URL of the S3-compatible object storage.
    endpointUrl: ""
    ## @param storage.s3.accessKey The access key to use.
    accessKey: ""
    ## @param storage.s3.secretKey The secret key to use.
    secretKey: ""
    ## @param storage.s3.region The optional region of the S3-compatible object storage.
    region: ""
    buckets:
      ## @param storage.s3.buckets.fileArchives The name of the S3 bucket to use for storing file archives.
      fileArchives: file-archives
      ## @param storage.s3.buckets.fileLists The name of the S3 bucket to use for storing file lists.
      fileLists: file-lists
      ## @param storage.s3.buckets.reports The name of the S3 bucket to use for storing reports.
      reports: reports
    prefixes:
      ## @param storage.s3.prefixes.fileArchives An optional prefix to use for storing file archives in the S3 bucket.
      ## Required when sharing the bucket with file lists or reports to avoid name collisions.
      fileArchives: ""
      ## @param storage.s3.prefixes.fileLists An optional prefix to use for storing file lists in the S3 bucket.
      ## Required when sharing the bucket with file archives or reports to avoid name collisions.
      fileLists: ""
      ## @param storage.s3.prefixes.reports An optional prefix to use for storing reports in the S3 bucket.
      ## Required when sharing the bucket with file archives or file lists to avoid name collisions.
      reports: ""

transport:
  queues:
    advisor: advisor
    analyzer: analyzer
    core: core
    evaluator: evaluator
    orchestrator: orchestrator
    reporter: reporter
    scanner: scanner
  kubernetes:
    imagePullPolicy: Always
    backoffLimit: 0
    restartPolicy: Never
    ## @param transport.kubernetes.userId The user ID to run the worker containers as.
    userId: 1000
    advisor:
      memoryRequest: 1Gi
      memoryLimit: 1Gi
    analyzer:
      memoryRequest: 4Gi
      memoryLimit: 4Gi
    config:
      memoryRequest: 1Gi
      memoryLimit: 1Gi
    evaluator:
      memoryRequest: 4Gi
      memoryLimit: 4Gi
    reporter:
      memoryRequest: 4Gi
      memoryLimit: 4Gi
    scanner:
      memoryRequest: 8Gi
      memoryLimit: 8Gi
  rabbitmq:
    enabled: true
    serverUri: ""
    username: ""
    password: ""

core:
  uiHosts: localhost:5173,localhost:8082
  service:
    port: 8081
  keycloak:
    jwtUri: https://keycloak.ortserver.org/realms/master/protocol/openid-connect/certs
    jwtIssuer: https://keycloak.ortserver.org/realms/master
    jwtAudience: ort-server
    jwtRealm: ort-server
    jwtRoleCacheLifetime: 60
    accessTokenUrl: https://keycloak.ortserver.org/realms/master/protocol/openid-connect/token
    apiUrl: https://keycloak.ortserver.org/admin/realms/master
    apiUser: ort-server
    apiSecret: ort-server
    clientId: admin-cli
    subjectClientId: ort-server
  livenessProbe:
    ## @param core.livenessProbe.enabled Enable livenessProbe for the core deployment
    enabled: true
    ## @param core.livenessProbe.initialDelaySeconds Initial delay before the liveness probe is initiated
    initialDelaySeconds: 60
    ## @param core.livenessProbe.periodSeconds Period between liveness probe checks
    periodSeconds: 10
    ## @param core.livenessProbe.timeoutSeconds Timeout for the liveness probe
    timeoutSeconds: 5
    ## @param core.livenessProbe.successThreshold Minimum consecutive successes for the liveness probe to be considered successful
    successThreshold: 1
    ## @param core.livenessProbe.failureThreshold Minimum consecutive failures for the liveness probe to be considered failed
    failureThreshold: 6
  ## @param core.resources CPU and memory requests and limits for the core deployment
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  certificates:
    ## @param core.certificates.path Path to a directory containing PEM-encoded certificates to import into the Java
    ## keystore at startup. Each file in the directory must contain one PEM-encoded certificate. When set, the container
    ## command is overridden to run the import script before starting the application. Typical usage: mount a Kubernetes
    ## Secret (one key per certificate) via extraVolumes and extraVolumeMounts, then set this to the mount path.
    path: ""
  ## @param core.extraVolumes Additional volumes for the core deployment
  extraVolumes: []
  ## @param core.extraVolumeMounts Additional volume mounts for the core deployment
  extraVolumeMounts: []
  ## @param core.extraEnv Additional environment variables for the core deployment
  extraEnv: []
  ## @param core.extraInitContainers Additional init containers for the core deployment
  extraInitContainers: []

orchestrator:
  ## @param orchestrator.resources CPU and memory requests and limits for the orchestrator deployment
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  ## @param orchestrator.extraVolumes Additional volumes for the orchestrator deployment
  extraVolumes: []
  ## @param orchestrator.extraVolumeMounts Additional volume mounts for the orchestrator deployment
  extraVolumeMounts: []
  ## @param orchestrator.extraEnv Additional environment variables for the orchestrator deployment
  extraEnv: []
  ## @param orchestrator.extraInitContainers Additional init containers for the orchestrator deployment
  extraInitContainers: []

advisor:
  ## @param advisor.mountEmptyDirs EmptyDir volumes to mount into the advisor worker pods. Each entry must be in the
  ## format "name->path", where "name" is the name of the EmptyDir volume and "path" is the path inside the container to
  ## mount the volume to. Multiple entries must be separated by whitespace.
  mountEmptyDirs: ""
  ## @param advisor.mountPvcs PVCs to mount into the advisor worker pods. Each entry must be in the format
  ## "pvcName->path,access", where "pvcName" is the name of the PVC to mount, "path" is the path inside the container
  ## to mount the PVC to, and "access" is either "R" for read-only or "W" for read-write access. Multiple entries must
  ## be separated by whitespace.
  mountPvcs: ""
  ## @param advisor.mountSecrets Secrets to mount into the advisor worker pods. Each entry must be in the format
  ## "secret->path|subPath", where "secret" is the name of the Secret to mount, "path" is the path inside the container
  ## to mount the Secret to, and "subPath" is an optional subPath of the Secret to mount.
  mountSecrets: ""

