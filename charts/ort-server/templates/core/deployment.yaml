apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ortserver.fullname" . }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ortserver.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- with .Values.core.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ortserver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        {{- include "ortserver.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: {{ include "ortserver.fullname" . }}-core-sa
      {{- with .Values.core.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- with .Values.core.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "ortserver.imagePullSecret" . | nindent 6 }}
      {{- with .Values.core.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "ortserver.fullname" . }}-core
          image: "{{ .Values.containerRegistry }}/ort-server-core:{{ .Chart.AppVersion }}"
          {{- with .Values.core.certificates.path }}
          command: ["/bin/sh"]
          args: ["-c", "/etc/scripts/import_certificates.sh {{ . }} && exec java -cp @/app/jib-classpath-file @/app/jib-main-class-file"]
          {{- end }}
          {{- with .Values.core.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          {{- if .Values.core.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /api/v1/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: {{ .Values.core.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.core.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.core.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.core.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.core.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.core.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /api/v1/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: {{ .Values.core.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.core.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.core.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.core.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.core.readinessProbe.failureThreshold }}
          {{- end }}
          volumeMounts:
            {{- with .Values.core.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "ortserver.env.adminSecrets" . | nindent 12 }}
            {{- include "ortserver.env.database" . | nindent 12 }}
            {{- include "ortserver.env.fileListStorage" . | nindent 12 }}
            {{- include "ortserver.env.logFileService" . | nindent 12 }}
            {{- include "ortserver.env.reportStorage" . | nindent 12 }}
            {{- include "ortserver.env.typesafeConfigOverride" . | nindent 12 }}
            {{- include "ortserver.env.userSecrets" . | nindent 12 }}

            # Config secrets
            - name: CORE_SECRET_PROVIDER
              value: {{ .Values.configSecrets.name }}
            - name: CORE_SECRET_FILES
              value: {{ .Values.configSecrets.files }}

            # Webserver
            - name: PORT
              value: "8080"
            - name: UI_HOSTS
              value: {{ .Values.core.uiHosts }}

            # Keycloak
            - name: JWT_URI
              value: {{ .Values.core.keycloak.jwtUri }}
            - name: JWT_ISSUER
              value: {{ .Values.core.keycloak.jwtIssuer }}
            - name: JWT_AUDIENCE
              value: {{ .Values.core.keycloak.jwtAudience }}
            - name: JWT_REALM
              value: {{ .Values.core.keycloak.jwtRealm }}
            - name: KEYCLOAK_ACCESS_TOKEN_URL
              value: {{ .Values.core.keycloak.accessTokenUrl }}
            - name: KEYCLOAK_API_URL
              value: {{ .Values.core.keycloak.apiUrl }}
            - name: KEYCLOAK_API_USER
              value: {{ .Values.core.keycloak.apiUser }}
            - name: KEYCLOAK_API_SECRET
              value: {{ .Values.core.keycloak.apiSecret }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.core.keycloak.clientId }}

            # Orchestrator sender
            {{- if .Values.transport.rabbitmq.enabled }}
            - name: ORCHESTRATOR_SENDER_TRANSPORT_TYPE
              value: rabbitMQ
            - name: ORCHESTRATOR_SENDER_TRANSPORT_QUEUE_NAME
              value: {{ .Values.transport.queues.orchestrator }}
            - name: ORCHESTRATOR_SENDER_TRANSPORT_SERVER_URI
              value: {{ .Values.transport.rabbitmq.serverUri }}
            # The RabbitMQ transport does not use the default properties for the credentials.
            - name: CONFIG_FORCE_orchestrator_sender_rabbitMqUser
              value: {{ .Values.transport.rabbitmq.username }}
            - name: CONFIG_FORCE_orchestrator_sender_rabbitMqPassword
              value: {{ .Values.transport.rabbitmq.password }}
            # - name: ORCHESTRATOR_SENDER_TRANSPORT_USERNAME
            #   value: {{ .Values.transport.rabbitmq.username }}
            # - name: ORCHESTRATOR_SENDER_TRANSPORT_PASSWORD
            #   value: {{ .Values.transport.rabbitmq.password }}
            {{- end }}

            {{- with .Values.core.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
