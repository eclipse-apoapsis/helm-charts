apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ortserver.fullname" . }}-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ortserver.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ortserver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "ortserver.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: {{ include "ortserver.fullname" . }}-orchestrator-sa
      volumes:
        {{- if .Values.orchestrator.extraVolumes }}
        {{- toYaml .Values.orchestrator.extraVolumes | nindent 8 }}
        {{- end }}
      {{- include "ortserver.imagePullSecret" . | nindent 6 }}
      {{- if .Values.orchestrator.extraInitContainers }}
      initContainers:
        {{- toYaml .Values.orchestrator.extraInitContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "ortserver.fullname" . }}-orchestrator
          image: "{{ .Values.containerRegistry }}/ort-server-orchestrator:{{ .Chart.AppVersion }}"
          {{- with .Values.orchestrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.orchestrator.extraVolumeMounts }}
            {{- toYaml .Values.orchestrator.extraVolumeMounts | nindent 12 }}
            {{- end }}
          env:
            {{- include "ortserver.env.adminSecrets" . | nindent 12 }}
            {{- include "ortserver.env.database" . | nindent 12 }}
            {{- include "ortserver.env.fileArchiveStorage" . | nindent 12 }}
            {{- include "ortserver.env.fileListStorage" . | nindent 12 }}
            {{- include "ortserver.env.reportStorage" . | nindent 12 }}
            {{- include "ortserver.env.typesafeConfigOverride" . | nindent 12 }}
            {{- include "ortserver.env.userSecrets" . | nindent 12 }}

            # Config secrets
            - name: ORCHESTRATOR_SECRET_PROVIDER
              value: {{ .Values.configSecrets.name }}
            - name: ORCHESTRATOR_SECRET_FILES
              value: {{ .Values.configSecrets.files }}

            # Orchestrator receiver
            {{- if .Values.transport.rabbitmq.enabled }}
            - name: ORCHESTRATOR_RECEIVER_TRANSPORT_TYPE
              value: rabbitMQ
            - name: ORCHESTRATOR_RECEIVER_TRANSPORT_QUEUE_NAME
              value: {{ .Values.transport.queues.orchestrator }}
            - name: ORCHESTRATOR_RECEIVER_TRANSPORT_SERVER_URI
              value: {{ .Values.transport.rabbitmq.serverUri }}
            # The RabbitMQ transport does not use the default properties for the credentials.
            - name: CONFIG_FORCE_orchestrator_receiver_rabbitMqUser
              value: {{ .Values.transport.rabbitmq.username }}
            - name: CONFIG_FORCE_orchestrator_receiver_rabbitMqPassword
              value: {{ .Values.transport.rabbitmq.password }}
            # - name: ORCHESTRATOR_RECEIVER_TRANSPORT_USERNAME
            #   value: {{ .Values.transport.rabbitmq.username }}
            # - name: ORCHESTRATOR_RECEIVER_TRANSPORT_PASSWORD
            #   value: {{ .Values.transport.rabbitmq.password }}
            {{- end }}

            # Orchestrator sender (used by worker jobs, not by orchestrator)
            {{- if .Values.transport.rabbitmq.enabled }}
            - name: ORCHESTRATOR_SENDER_TRANSPORT_TYPE
              value: rabbitMQ
            - name: ORCHESTRATOR_SENDER_TRANSPORT_QUEUE_NAME
              value: {{ .Values.transport.queues.orchestrator }}
            - name: ORCHESTRATOR_SENDER_TRANSPORT_SERVER_URI
              value: {{ .Values.transport.rabbitmq.serverUri }}
            # The RabbitMQ transport does not use the default properties for the credentials.
            - name: CONFIG_FORCE_orchestrator_sender_rabbitMqUser
              value: {{ .Values.transport.rabbitmq.username }}
            - name: CONFIG_FORCE_orchestrator_sender_rabbitMqPassword
              value: {{ .Values.transport.rabbitmq.password }}
            # - name: ORCHESTRATOR_SENDER_TRANSPORT_USERNAME
            #   value: {{ .Values.transport.rabbitmq.username }}
            # - name: ORCHESTRATOR_SENDER_TRANSPORT_PASSWORD
            #   value: {{ .Values.transport.rabbitmq.password }}
            {{- end }}

            # Advisor sender (only supports Kubernetes transport for now)
            - name: ADVISOR_SENDER_TRANSPORT_TYPE
              value: kubernetes
            - name: ADVISOR_SENDER_TRANSPORT_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: ADVISOR_SENDER_TRANSPORT_IMAGE_NAME
              value: "{{ .Values.containerRegistry }}/ort-server-advisor-worker:{{ .Chart.AppVersion }}"
            - name: ADVISOR_SENDER_TRANSPORT_IMAGE_PULL_POLICY
              value: {{ .Values.transport.kubernetes.imagePullPolicy }}
            {{- with .Values.imagePullSecret }}
            - name: ADVISOR_SENDER_TRANSPORT_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: ADVISOR_SENDER_TRANSPORT_BACKOFF_LIMIT
              value: "{{ .Values.transport.kubernetes.backoffLimit }}"
            - name: ADVISOR_SENDER_TRANSPORT_RESTART_POLICY
              value: {{ .Values.transport.kubernetes.restartPolicy }}
            {{- if .Values.transport.kubernetes.advisor.cpuRequest }}
            - name: ADVISOR_SENDER_TRANSPORT_CPU_REQUEST
              value: {{ .Values.transport.kubernetes.advisor.cpuRequest }}
            {{- end }}
            {{- if .Values.transport.kubernetes.advisor.cpuLimit }}
            - name: ADVISOR_SENDER_TRANSPORT_CPU_LIMIT
              value: {{ .Values.transport.kubernetes.advisor.cpuLimit }}
            {{- end }}
            - name: ADVISOR_SENDER_TRANSPORT_MEMORY_REQUEST
              value: {{ .Values.transport.kubernetes.advisor.memoryRequest }}
            - name: ADVISOR_SENDER_TRANSPORT_MEMORY_LIMIT
              value: {{ .Values.transport.kubernetes.advisor.memoryLimit }}
            - name: ADVISOR_SERVICE_ACCOUNT
              value: {{ include "ortserver.fullname" . }}-workers-sa
            {{- with include "ortserver.workerLabelsAsString" . }}
            - name: ADVISOR_LABELS
              value: {{ . | quote }}
            {{- end }}
            - name: ADVISOR_USER_ID
              value: "{{ .Values.transport.kubernetes.userId }}"
            # Advisor worker config used by sender
            {{- if .Values.configFileProvider.gitConfig.enabled }}
            - name: ADVISOR_CONFIG_FILE_PROVIDER
              value: git-config
            - name: ADVISOR_CONFIG_GIT_URL
              value: {{ .Values.configFileProvider.gitConfig.repositoryUrl }}
            {{- end }}
            - name: ADVISOR_MOUNT_EMPTY_DIRS
              value: {{ .Values.transport.kubernetes.advisor.mountEmptyDirs }}
            - name: ADVISOR_MOUNT_PVCS
              value: {{ .Values.transport.kubernetes.advisor.mountPvcs }}
            - name: ADVISOR_MOUNT_SECRETS
              value: {{ .Values.transport.kubernetes.advisor.mountSecrets }}
            - name: ADVISOR_SECRET_PROVIDER
              value: {{ .Values.configSecrets.name }}
            - name: ADVISOR_SECRET_FILES
              value: {{ .Values.configSecrets.files }}

            # Analyzer sender (only supports Kubernetes transport for now)
            - name: ANALYZER_SENDER_TRANSPORT_TYPE
              value: kubernetes
            - name: ANALYZER_SENDER_TRANSPORT_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: ANALYZER_SENDER_TRANSPORT_IMAGE_NAME
              value: "{{ .Values.containerRegistry }}/ort-server-analyzer-worker:{{ .Chart.AppVersion }}"
            - name: ANALYZER_SENDER_TRANSPORT_IMAGE_PULL_POLICY
              value: {{ .Values.transport.kubernetes.imagePullPolicy }}
            {{- with .Values.imagePullSecret }}
            - name: ANALYZER_SENDER_TRANSPORT_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: ANALYZER_SENDER_TRANSPORT_BACKOFF_LIMIT
              value: "{{ .Values.transport.kubernetes.backoffLimit }}"
            - name: ANALYZER_SENDER_TRANSPORT_RESTART_POLICY
              value: {{ .Values.transport.kubernetes.restartPolicy }}
            {{- if .Values.transport.kubernetes.analyzer.cpuRequest }}
            - name: ANALYZER_SENDER_TRANSPORT_CPU_REQUEST
              value: {{ .Values.transport.kubernetes.analyzer.cpuRequest }}
            {{- end }}
            {{- if .Values.transport.kubernetes.analyzer.cpuLimit }}
            - name: ANALYZER_SENDER_TRANSPORT_CPU_LIMIT
              value: {{ .Values.transport.kubernetes.analyzer.cpuLimit }}
            {{- end }}
            - name: ANALYZER_SENDER_TRANSPORT_MEMORY_REQUEST
              value: {{ .Values.transport.kubernetes.analyzer.memoryRequest }}
            - name: ANALYZER_SENDER_TRANSPORT_MEMORY_LIMIT
              value: {{ .Values.transport.kubernetes.analyzer.memoryLimit }}
            - name: ANALYZER_SERVICE_ACCOUNT
              value: {{ include "ortserver.fullname" . }}-workers-sa
            {{- with include "ortserver.workerLabelsAsString" . }}
            - name: ANALYZER_LABELS
              value: {{ . | quote }}
            {{- end }}
            - name: ANALYZER_USER_ID
              value: "{{ .Values.transport.kubernetes.userId }}"
            # Analyzer worker config used by sender
            {{- if .Values.configFileProvider.gitConfig.enabled }}
            - name: ANALYZER_CONFIG_FILE_PROVIDER
              value: git-config
            - name: ANALYZER_CONFIG_GIT_URL
              value: {{ .Values.configFileProvider.gitConfig.repositoryUrl }}
            {{- end }}
            - name: ANALYZER_MOUNT_EMPTY_DIRS
              value: {{ .Values.transport.kubernetes.analyzer.mountEmptyDirs }}
            - name: ANALYZER_MOUNT_PVCS
              value: {{ .Values.transport.kubernetes.analyzer.mountPvcs }}
            - name: ANALYZER_MOUNT_SECRETS
              value: {{ .Values.transport.kubernetes.analyzer.mountSecrets }}
            - name: ANALYZER_SECRET_PROVIDER
              value: {{ .Values.configSecrets.name }}
            - name: ANALYZER_SECRET_FILES
              value: {{ .Values.configSecrets.files }}

            # Config sender (only supports Kubernetes transport for now)
            - name: CONFIG_SENDER_TRANSPORT_TYPE
              value: kubernetes
            - name: CONFIG_SENDER_TRANSPORT_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: CONFIG_SENDER_TRANSPORT_IMAGE_NAME
              value: "{{ .Values.containerRegistry }}/ort-server-config-worker:{{ .Chart.AppVersion }}"
            - name: CONFIG_SENDER_TRANSPORT_IMAGE_PULL_POLICY
              value: {{ .Values.transport.kubernetes.imagePullPolicy }}
            {{- with .Values.imagePullSecret }}
            - name: CONFIG_SENDER_TRANSPORT_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: CONFIG_SENDER_TRANSPORT_BACKOFF_LIMIT
              value: "{{ .Values.transport.kubernetes.backoffLimit }}"
            - name: CONFIG_SENDER_TRANSPORT_RESTART_POLICY
              value: {{ .Values.transport.kubernetes.restartPolicy }}
            {{- if .Values.transport.kubernetes.config.cpuRequest }}
            - name: CONFIG_SENDER_TRANSPORT_CPU_REQUEST
              value: {{ .Values.transport.kubernetes.config.cpuRequest }}
            {{- end }}
            {{- if .Values.transport.kubernetes.config.cpuLimit }}
            - name: CONFIG_SENDER_TRANSPORT_CPU_LIMIT
              value: {{ .Values.transport.kubernetes.config.cpuLimit }}
            {{- end }}
            - name: CONFIG_SENDER_TRANSPORT_MEMORY_REQUEST
              value: {{ .Values.transport.kubernetes.config.memoryRequest }}
            - name: CONFIG_SENDER_TRANSPORT_MEMORY_LIMIT
              value: {{ .Values.transport.kubernetes.config.memoryLimit }}
            - name: CONFIG_SERVICE_ACCOUNT
              value: {{ include "ortserver.fullname" . }}-workers-sa
            {{- with include "ortserver.workerLabelsAsString" . }}
            - name: CONFIG_LABELS
              value: {{ . | quote }}
            {{- end }}
            - name: CONFIG_USER_ID
              value: "{{ .Values.transport.kubernetes.userId }}"
            # Config worker config used by sender
            {{- if .Values.configFileProvider.gitConfig.enabled }}
            - name: CONFIG_CONFIG_FILE_PROVIDER
              value: git-config
            - name: CONFIG_CONFIG_GIT_URL
              value: {{ .Values.configFileProvider.gitConfig.repositoryUrl }}
            {{- end }}
            - name: CONFIG_MOUNT_EMPTY_DIRS
              value: {{ .Values.transport.kubernetes.config.mountEmptyDirs }}
            - name: CONFIG_MOUNT_PVCS
              value: {{ .Values.transport.kubernetes.config.mountPvcs }}
            - name: CONFIG_MOUNT_SECRETS
              value: {{ .Values.transport.kubernetes.config.mountSecrets }}
            - name: CONFIG_SECRET_PROVIDER
              value: {{ .Values.configSecrets.name }}
            - name: CONFIG_SECRET_FILES
              value: {{ .Values.configSecrets.files }}

            # Evaluator sender (only supports Kubernetes transport for now)
            - name: EVALUATOR_SENDER_TRANSPORT_TYPE
              value: kubernetes
            - name: EVALUATOR_SENDER_TRANSPORT_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: EVALUATOR_SENDER_TRANSPORT_IMAGE_NAME
              value: "{{ .Values.containerRegistry }}/ort-server-evaluator-worker:{{ .Chart.AppVersion }}"
            - name: EVALUATOR_SENDER_TRANSPORT_IMAGE_PULL_POLICY
              value: {{ .Values.transport.kubernetes.imagePullPolicy }}
            {{- with .Values.imagePullSecret }}
            - name: EVALUATOR_SENDER_TRANSPORT_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: EVALUATOR_SENDER_TRANSPORT_BACKOFF_LIMIT
              value: "{{ .Values.transport.kubernetes.backoffLimit }}"
            - name: EVALUATOR_SENDER_TRANSPORT_RESTART_POLICY
              value: {{ .Values.transport.kubernetes.restartPolicy }}
            {{- if .Values.transport.kubernetes.evaluator.cpuRequest }}
            - name: EVALUATOR_SENDER_TRANSPORT_CPU_REQUEST
              value: {{ .Values.transport.kubernetes.evaluator.cpuRequest }}
            {{- end }}
            {{- if .Values.transport.kubernetes.evaluator.cpuLimit }}
            - name: EVALUATOR_SENDER_TRANSPORT_CPU_LIMIT
              value: {{ .Values.transport.kubernetes.evaluator.cpuLimit }}
            {{- end }}
            - name: EVALUATOR_SENDER_TRANSPORT_MEMORY_REQUEST
              value: {{ .Values.transport.kubernetes.evaluator.memoryRequest }}
            - name: EVALUATOR_SENDER_TRANSPORT_MEMORY_LIMIT
              value: {{ .Values.transport.kubernetes.evaluator.memoryLimit }}
            - name: EVALUATOR_SERVICE_ACCOUNT
              value: {{ include "ortserver.fullname" . }}-workers-sa
            {{- with include "ortserver.workerLabelsAsString" . }}
            - name: EVALUATOR_LABELS
              value: {{ . | quote }}
            {{- end }}
            - name: EVALUATOR_USER_ID
              value: "{{ .Values.transport.kubernetes.userId }}"
            # Evaluator worker config used by sender
            {{- if .Values.configFileProvider.gitConfig.enabled }}
            - name: EVALUATOR_CONFIG_FILE_PROVIDER
              value: git-config
            - name: EVALUATOR_CONFIG_GIT_URL
              value: {{ .Values.configFileProvider.gitConfig.repositoryUrl }}
            {{- end }}
            - name: EVALUATOR_MOUNT_EMPTY_DIRS
              value: {{ .Values.transport.kubernetes.evaluator.mountEmptyDirs }}
            - name: EVALUATOR_MOUNT_PVCS
              value: {{ .Values.transport.kubernetes.evaluator.mountPvcs }}
            - name: EVALUATOR_MOUNT_SECRETS
              value: {{ .Values.transport.kubernetes.evaluator.mountSecrets }}
            - name: EVALUATOR_SECRET_PROVIDER
              value: {{ .Values.configSecrets.name }}
            - name: EVALUATOR_SECRET_FILES
              value: {{ .Values.configSecrets.files }}

            # Reporter sender (only supports Kubernetes transport for now)
            - name: REPORTER_SENDER_TRANSPORT_TYPE
              value: kubernetes
            - name: REPORTER_SENDER_TRANSPORT_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: REPORTER_SENDER_TRANSPORT_IMAGE_NAME
              value: "{{ .Values.containerRegistry }}/ort-server-reporter-worker:{{ .Chart.AppVersion }}"
            - name: REPORTER_SENDER_TRANSPORT_IMAGE_PULL_POLICY
              value: {{ .Values.transport.kubernetes.imagePullPolicy }}
            {{- with .Values.imagePullSecret }}
            - name: REPORTER_SENDER_TRANSPORT_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: REPORTER_SENDER_TRANSPORT_BACKOFF_LIMIT
              value: "{{ .Values.transport.kubernetes.backoffLimit }}"
            - name: REPORTER_SENDER_TRANSPORT_RESTART_POLICY
              value: {{ .Values.transport.kubernetes.restartPolicy }}
            {{- if .Values.transport.kubernetes.reporter.cpuRequest }}
            - name: REPORTER_SENDER_TRANSPORT_CPU_REQUEST
              value: {{ .Values.transport.kubernetes.reporter.cpuRequest }}
            {{- end }}
            {{- if .Values.transport.kubernetes.reporter.cpuLimit }}
            - name: REPORTER_SENDER_TRANSPORT_CPU_LIMIT
              value: {{ .Values.transport.kubernetes.reporter.cpuLimit }}
            {{- end }}
            - name: REPORTER_SENDER_TRANSPORT_MEMORY_REQUEST
              value: {{ .Values.transport.kubernetes.reporter.memoryRequest }}
            - name: REPORTER_SENDER_TRANSPORT_MEMORY_LIMIT
              value: {{ .Values.transport.kubernetes.reporter.memoryLimit }}
            - name: REPORTER_SERVICE_ACCOUNT
              value: {{ include "ortserver.fullname" . }}-workers-sa
            {{- with include "ortserver.workerLabelsAsString" . }}
            - name: REPORTER_LABELS
              value: {{ . | quote }}
            {{- end }}
            - name: REPORTER_USER_ID
              value: "{{ .Values.transport.kubernetes.userId }}"
            # Reporter worker config used by sender
            {{- if .Values.configFileProvider.gitConfig.enabled }}
            - name: REPORTER_CONFIG_FILE_PROVIDER
              value: git-config
            - name: REPORTER_CONFIG_GIT_URL
              value: {{ .Values.configFileProvider.gitConfig.repositoryUrl }}
            {{- end }}
            - name: REPORTER_MOUNT_EMPTY_DIRS
              value: {{ .Values.transport.kubernetes.reporter.mountEmptyDirs }}
            - name: REPORTER_MOUNT_PVCS
              value: {{ .Values.transport.kubernetes.reporter.mountPvcs }}
            - name: REPORTER_MOUNT_SECRETS
              value: {{ .Values.transport.kubernetes.reporter.mountSecrets }}
            - name: REPORTER_SECRET_PROVIDER
              value: {{ .Values.configSecrets.name }}
            - name: REPORTER_SECRET_FILES
              value: {{ .Values.configSecrets.files }}

            # Scanner sender (only supports Kubernetes transport for now)
            - name: SCANNER_SENDER_TRANSPORT_TYPE
              value: kubernetes
            - name: SCANNER_SENDER_TRANSPORT_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: SCANNER_SENDER_TRANSPORT_IMAGE_NAME
              value: "{{ .Values.containerRegistry }}/ort-server-scanner-worker:{{ .Chart.AppVersion }}"
            - name: SCANNER_SENDER_TRANSPORT_IMAGE_PULL_POLICY
              value: {{ .Values.transport.kubernetes.imagePullPolicy }}
            {{- with .Values.imagePullSecret }}
            - name: SCANNER_SENDER_TRANSPORT_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: SCANNER_SENDER_TRANSPORT_BACKOFF_LIMIT
              value: "{{ .Values.transport.kubernetes.backoffLimit }}"
            - name: SCANNER_SENDER_TRANSPORT_RESTART_POLICY
              value: {{ .Values.transport.kubernetes.restartPolicy }}
            {{- if .Values.transport.kubernetes.scanner.cpuRequest }}
            - name: SCANNER_SENDER_TRANSPORT_CPU_REQUEST
              value: {{ .Values.transport.kubernetes.scanner.cpuRequest }}
            {{- end }}
            {{- if .Values.transport.kubernetes.scanner.cpuLimit }}
            - name: SCANNER_SENDER_TRANSPORT_CPU_LIMIT
              value: {{ .Values.transport.kubernetes.scanner.cpuLimit }}
            {{- end }}
            - name: SCANNER_SENDER_TRANSPORT_MEMORY_REQUEST
              value: {{ .Values.transport.kubernetes.scanner.memoryRequest }}
            - name: SCANNER_SENDER_TRANSPORT_MEMORY_LIMIT
              value: {{ .Values.transport.kubernetes.scanner.memoryLimit }}
            - name: SCANNER_SERVICE_ACCOUNT
              value: {{ include "ortserver.fullname" . }}-workers-sa
            {{- with include "ortserver.workerLabelsAsString" . }}
            - name: SCANNER_LABELS
              value: {{ . | quote }}
            {{- end }}
            - name: SCANNER_USER_ID
              value: "{{ .Values.transport.kubernetes.userId }}"
            # Scanner worker config used by sender
            {{- if .Values.configFileProvider.gitConfig.enabled }}
            - name: SCANNER_CONFIG_FILE_PROVIDER
              value: git-config
            - name: SCANNER_CONFIG_GIT_URL
              value: {{ .Values.configFileProvider.gitConfig.repositoryUrl }}
            {{- end }}
            - name: SCANNER_MOUNT_EMPTY_DIRS
              value: {{ .Values.transport.kubernetes.scanner.mountEmptyDirs }}
            - name: SCANNER_MOUNT_PVCS
              value: {{ .Values.transport.kubernetes.scanner.mountPvcs }}
            - name: SCANNER_MOUNT_SECRETS
              value: {{ .Values.transport.kubernetes.scanner.mountSecrets }}
            - name: SCANNER_SECRET_PROVIDER
              value: {{ .Values.configSecrets.name }}
            - name: SCANNER_SECRET_FILES
              value: {{ .Values.configSecrets.files }}

            {{- with .Values.orchestrator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
